name: Playwright E2E diagnosis
description: Run Playwright tests and post a diagnosis to the PR: failing file:line, failure kind, flaky verdict and fix diffs.
author: xsignon-secure
branding:
  icon: check-circle
  color: green

inputs:
  project-root:
    description: Directory that holds playwright.config.* (default the workspace)
    default: .
  args:
    description: Extra arguments for `playwright-e2e-mcp ci`, e.g. "--browser chromium --workers 2 tests/checkout"
    default: ''
  flaky-runs:
    description: Repeat failing tests this many times (2-10) for a flaky verdict; 0 skips it
    default: '3'
  suggest:
    description: Draft suggest-fix diffs for the first N failures (0-5)
    default: '2'
  comment:
    description: Post (or update) one PR comment with the report when the run fails
    default: 'true'
  review:
    description: On a pull request, post each suggested fix as a GitHub suggested change on the failing line, so a reviewer applies it with one click (only lines the PR changed)
    default: 'true'
  verify-fixes:
    description: Re-run each failing test with its fix applied and post only fixes that pass (the workspace is restored afterwards)
    default: 'true'
  guard:
    description: On a pull request, run the heal guard first and fail when changed tests were made to pass by checking less (deleted assertions, skipped or removed tests, .only)
    default: 'false'
  pro-key:
    description: Optional Pro key (use a secret). When set, the run is uploaded to Pro Cloud CI history; when empty nothing is sent anywhere
    default: ''
  pro-url:
    description: Pro Cloud address, required with pro-key
    default: ''
  fail-on-failure:
    description: Fail the step when tests fail
    default: 'true'
  version:
    description: playwright-e2e-mcp version to run from npm
    default: 0.7.0
  github-token:
    description: Token for the PR comment (needs pull-requests write)
    default: ${{ github.token }}

outputs:
  exit-code:
    description: 0 passed, 1 tests failed, 2 the run itself failed
    value: ${{ steps.diagnose.outputs.exit-code }}
  report:
    description: Path of the Markdown report
    value: ${{ steps.diagnose.outputs.report }}
  guard:
    description: Heal guard exit code (0 OK, 1 blocked, 2 could not run); empty when the guard is off
    value: ${{ steps.guard.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: guard
      if: inputs.guard == 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.project-root }}
      env:
        PW_E2E_VERSION: ${{ inputs.version }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        # The checkout is usually shallow: fetch just the base tip to compare with.
        git fetch --no-tags --depth=1 origin "$BASE_REF"
        set +e
        npx -y "playwright-e2e-mcp@$PW_E2E_VERSION" guard --base FETCH_HEAD
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - id: diagnose
      shell: bash
      working-directory: ${{ inputs.project-root }}
      env:
        PW_E2E_VERSION: ${{ inputs.version }}
        PW_E2E_ARGS: ${{ inputs.args }}
        PW_E2E_FLAKY: ${{ inputs.flaky-runs }}
        PW_E2E_SUGGEST: ${{ inputs.suggest }}
        PW_E2E_REVIEW: ${{ inputs.review == 'true' && github.event_name == 'pull_request' && inputs.suggest != '0' }}
        PW_E2E_VERIFY: ${{ inputs.verify-fixes }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        report="$RUNNER_TEMP/playwright-e2e-report.md"
        extra=()
        if [ "$PW_E2E_FLAKY" != "0" ]; then extra+=(--flaky-runs "$PW_E2E_FLAKY"); fi
        extra+=(--suggest "$PW_E2E_SUGGEST")
        if [ "$PW_E2E_SUGGEST" != "0" ] && [ "$PW_E2E_VERIFY" = "true" ]; then extra+=(--verify-fixes); fi
        if [ "$PW_E2E_REVIEW" = "true" ]; then extra+=(--review); fi
        # Word-split args on purpose: it is a list of flags and paths.
        # shellcheck disable=SC2086
        set +e
        npx -y "playwright-e2e-mcp@$PW_E2E_VERSION" ci --output "$report" "${extra[@]}" $PW_E2E_ARGS
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"

    - if: always() && inputs.pro-key != ''
      shell: bash
      working-directory: ${{ inputs.project-root }}
      env:
        PW_E2E_VERSION: ${{ inputs.version }}
        PW_MCP_PRO_KEY: ${{ inputs.pro-key }}
        PW_MCP_PRO_URL: ${{ inputs.pro-url }}
      run: |
        # History upload is best effort: it never fails the job.
        npx -y "playwright-e2e-mcp@$PW_E2E_VERSION" upload || echo "::warning::Could not upload the run to Pro Cloud."

    - if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.diagnose.outputs.exit-code != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.diagnose.outputs.report }}
      run: |
        # One comment per PR, edited on every run instead of piling up.
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT" --edit-last --create-if-none \
          || echo "::warning::Could not comment on the PR (token needs pull-requests: write)."

    - if: steps.guard.outputs.exit-code == '1'
      shell: bash
      run: |
        echo "::error::Heal guard blocked this change: a test was made to pass by checking less. See the job summary."
        exit 1

    - if: inputs.fail-on-failure == 'true' && steps.diagnose.outputs.exit-code != '0'
      shell: bash
      env:
        CODE: ${{ steps.diagnose.outputs.exit-code }}
      run: |
        echo "::error::Playwright run failed (exit $CODE). See the job summary for the diagnosis."
        exit 1
