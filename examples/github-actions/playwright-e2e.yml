name: Playwright E2E Diagnosis

on:
  pull_request:
  push:
    branches: [main, master]

# Permissions required:
# - contents: read to check out the repository
# - pull-requests: write to post/update the PR comment report and suggested fixes
permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E diagnosis action
        id: e2e
        uses: xsignon-secure/E2E@v0.7.0
        with:
          # Directory containing playwright.config.* (default is workspace root)
          project-root: .

          # Extra arguments passed to playwright-e2e-mcp ci, e.g. "--browser chromium tests/checkout"
          # args: --browser chromium tests/

          # Repeat failing tests (2-10) to obtain an empirical flaky verdict; 0 skips
          flaky-runs: 3

          # Draft suggest-fix diffs for the first N failures (0-5)
          suggest: 2

          # Re-run each failing test with its fix applied and post only verified fixes
          verify-fixes: true

          # Post verified fixes directly as one-click GitHub suggested changes on the PR
          review: true

          # Post/edit a single diagnosis summary comment on the PR
          comment: true

          # Heal guard: block test changes that pass by checking less (deleted assertions, skipped tests, .only)
          # guard: true

          # Pro Cloud integration (optional, paid): upload run history to Pro Cloud
          # pro-key: ${{ secrets.PW_MCP_PRO_KEY }}
          # pro-url: https://pro.example.com

          # Fail step when tests fail (default: true)
          fail-on-failure: true

      - name: Upload diagnosis report
        if: always() && steps.e2e.outputs.report != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-diagnosis-report
          path: ${{ steps.e2e.outputs.report }}
          retention-days: 14
